name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned syntax parser
        run: npm ci --ignore-scripts --prefix qualification/v4/js-policy
      - name: Validate package, installer, and portable workflows
        run: python -m pytest tests -q --ignore=tests/test_evidence.py
      - name: Check Python syntax
        run: python -m compileall -q scripts skills myskills
      - name: Validate governed catalog
        run: python -m myskills validate
      - name: Retain deterministic composed journey
        run: |
          mkdir -p .artifacts/myskills
          python -m myskills.reference_journey > .artifacts/myskills/composed-journey.json
      - uses: actions/upload-artifact@v4
        with:
          name: myskills-composed-journey
          path: .artifacts/myskills/composed-journey.json
  myskills-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/myskills-browser/package-lock.json
      - name: Install pinned browser tooling
        run: npm ci --prefix scripts/myskills-browser
      - name: Install Chromium
        working-directory: scripts/myskills-browser
        run: npx playwright install --with-deps chromium
      - name: Qualify local owner journeys and accessibility
        run: node tests/myskills-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myskills-browser-evidence
          path: .artifacts/myskills/browser
  myskills-qualification-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned static parser for checkpoint 5 controls
        run: npm ci --ignore-scripts --prefix qualification/v4/js-policy
      - name: Load the exact offline verifier image
        run: docker pull --platform linux/amd64 node:24-bookworm@sha256:5a750d3be5e5c80275f8c9a5367c3aed99c2875656590c8d0701c7ee687f5f0a
      - name: Restore pinned synthetic observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m qualification.retain --restore .artifacts/qualification/retained --pin qualification/initial-cohort/observations-pin.json
      - name: Recheck artifacts, confinement and cohort decisions without model calls
        run: python -m qualification.checkpoint --observations .artifacts/qualification/retained --output .artifacts/qualification/checkpoint
      - name: Reproduce package and admission assessment
        run: |
          python -m myskills.cohort_assessment --output .artifacts/qualification/assessment
          python -m myskills.cohort_assessment --verify .artifacts/qualification/assessment --pin qualification/initial-cohort/assessment-pin.json
      - name: Restore checkpoint 2 synthetic observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m qualification.custody_v2 --restore .artifacts/qualification/checkpoint2-retained
      - name: Independently replay checkpoint 2 without model calls
        run: python -m qualification.checkpoint_two --retained .artifacts/qualification/checkpoint2-retained --output .artifacts/qualification/checkpoint2
      - name: Restore checkpoint 3 synthetic observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m qualification.custody_v3 --restore .artifacts/qualification/checkpoint3-retained
      - name: Independently replay checkpoint 3 native workflows without model calls
        run: python -m qualification.checkpoint_three --retained .artifacts/qualification/checkpoint3-retained --output .artifacts/qualification/checkpoint3
      - name: Restore checkpoint 4 native observations and failed attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m qualification.custody_v4 --restore .artifacts/qualification/checkpoint4-retained
      - name: Independently replay checkpoint 4 tools and output counterexamples without model calls
        run: python -m qualification.checkpoint_four --retained .artifacts/qualification/checkpoint4-retained --output .artifacts/qualification/checkpoint4
      - name: Restore checkpoint 5 native TDD observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m qualification.custody_v5 --restore .artifacts/qualification/checkpoint5-retained
      - name: Independently replay checkpoint 5 red-green, adversarial and retained-failure controls
        run: python -m qualification.checkpoint_five --retained .artifacts/qualification/checkpoint5-retained --previous .artifacts/qualification/checkpoint4-retained --output .artifacts/qualification/checkpoint5
      - name: Restore checkpoint 5 API and security follow-ups
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m qualification.custody_v5 --pin qualification/checkpoint5/followup-evidence-pin.json --restore .artifacts/qualification/checkpoint5-followup-retained
      - name: Independently replay follow-ups and preserve reviewed failures
        run: python -m qualification.checkpoint_five_followup --retained .artifacts/qualification/checkpoint5-followup-retained --output .artifacts/qualification/checkpoint5-followup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myskills-initial-qualification
          path: .artifacts/qualification
