name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate package, installer, and portable workflows
        run: python -m pytest tests -q --ignore=tests/test_evidence.py
      - name: Check Python syntax
        run: python -m compileall -q scripts skills myskills
      - name: Validate governed catalog
        run: python -m myskills validate
      - name: Retain deterministic composed journey
        run: |
          mkdir -p .artifacts/myskills
          python -m myskills.reference_journey > .artifacts/myskills/composed-journey.json
      - uses: actions/upload-artifact@v4
        with:
          name: myskills-composed-journey
          path: .artifacts/myskills/composed-journey.json
  myskills-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/myskills-browser/package-lock.json
      - name: Install pinned browser tooling
        run: npm ci --prefix scripts/myskills-browser
      - name: Install Chromium
        working-directory: scripts/myskills-browser
        run: npx playwright install --with-deps chromium
      - name: Qualify local owner journeys and accessibility
        run: node tests/myskills-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myskills-browser-evidence
          path: .artifacts/myskills/browser
  myskills-qualification-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load the exact offline verifier image
        run: docker pull --platform linux/amd64 node:24-bookworm@sha256:5a750d3be5e5c80275f8c9a5367c3aed99c2875656590c8d0701c7ee687f5f0a
      - name: Restore pinned synthetic observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m qualification.retain --restore .artifacts/qualification/retained --pin qualification/initial-cohort/observations-pin.json
      - name: Recheck artifacts, confinement and cohort decisions without model calls
        run: python -m qualification.checkpoint --observations .artifacts/qualification/retained --output .artifacts/qualification/checkpoint
      - name: Reproduce package and admission assessment
        run: |
          python -m myskills.cohort_assessment --output .artifacts/qualification/assessment
          python -m myskills.cohort_assessment --verify .artifacts/qualification/assessment --pin qualification/initial-cohort/assessment-pin.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myskills-initial-qualification
          path: .artifacts/qualification
