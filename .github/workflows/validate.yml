name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate package, installer, and portable workflows
        run: python -m pytest tests -q --ignore=tests/test_evidence.py
      - name: Check Python syntax
        run: python -m compileall -q scripts skills
