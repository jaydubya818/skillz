name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate package, installer, and portable workflows
        run: python -m pytest tests -q --ignore=tests/test_evidence.py
      - name: Check Python syntax
        run: python -m compileall -q scripts skills
      - name: Check release metadata
        run: python scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Build source archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="skillz-${GITHUB_REF_NAME#v}/" --output="dist/skillz-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"
          git archive --format=zip --prefix="skillz-${GITHUB_REF_NAME#v}/" --output="dist/skillz-${GITHUB_REF_NAME}.zip" "$GITHUB_SHA"
          cd dist
          sha256sum "skillz-${GITHUB_REF_NAME}.tar.gz" "skillz-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
